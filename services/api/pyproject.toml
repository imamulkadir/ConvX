[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "convx-backend"
version = "0.2.0"
description = "Private asynchronous EDGAR conversion backend foundation"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.162.0", "uvicorn[standard]==0.54.0", "pydantic-settings==2.16.2",
  "python-multipart==0.0.33", "SQLAlchemy==2.1.8", "psycopg[binary]==3.3.8",
  "celery[redis]==5.6.3", "lxml==6.1.3"
]

[project.optional-dependencies]
test = ["pytest==9.2.0", "httpx==0.28.1", "pytest-cov==7.1.0", "ruff==0.17.3"]

[tool.setuptools]
packages = ["app", "app.api", "app.core", "app.models", "app.schemas", "app.services"]
