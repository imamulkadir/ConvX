[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/runtime", "tests/regression", "tests/integration/test_visual_validation.py", "tests/integration/test_document_processing.py", "tests/integration/test_packaging_gates.py", "tests/integration/test_standard_renderer.py", "tests/integration/test_edgar_renderer.py", "tests/integration/test_conversion_matrix.py"]
pythonpath = ["packages", "."]
addopts = "-ra"
markers = ["redis: requires a real Redis server via CONVX_TEST_REDIS_URL", "postgres: requires a disposable PostgreSQL database via CONVX_TEST_DATABASE_URL"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "S", "UP"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108"]
